plugins {
    id 'com.android.application'
}

android {
    namespace 'com.whyun.witv'
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.whyun.witv"
        // Media3 1.9+ 与 AndroidX 对齐，要求 minSdk 23
        minSdk 23
        targetSdk 34
        versionCode 5
        versionName "1.3.0"
        buildConfigField "long", "BUILD_TIME_MILLIS", "${System.currentTimeMillis()}L"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // NextLib 的 FFmpeg 软解带原生库，四个 ABI 全带会让 APK 多出一倍体积。
            // 发布包只保留 ARM（Android TV 盒子全是 ARM）；debug 保留全部 ABI，
            // 以便在 x86_64 模拟器上调试。
            ndk {
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    def media3_version = "1.10.0"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.14.1"
    testImplementation "androidx.test:core:1.6.1"

    // FFmpeg 软解扩展（MPEG-2 视频、MP2/AC3/DTS 音频等盒子硬解常缺的编码）。
    // 版本号格式为 <media3 版本>-<nextlib 版本>，必须与下面的 media3_version 严格一致，
    // 否则运行时会因 Media3 内部 API 变动抛 NoSuchMethodError。
    implementation "io.github.anilbeesetti:nextlib-media3ext:1.10.0-0.12.1"

    // Media3 ExoPlayer（stable，升级后请在目标盒子上做播放回归）
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3_version"
    implementation "androidx.media3:media3-exoplayer-dash:$media3_version"
    implementation "androidx.media3:media3-exoplayer-smoothstreaming:$media3_version"
    implementation "androidx.media3:media3-exoplayer-rtsp:$media3_version"
    implementation "androidx.media3:media3-datasource:$media3_version"
    implementation "androidx.media3:media3-database:$media3_version"
    implementation "androidx.media3:media3-datasource-rtmp:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"
    implementation "androidx.media3:media3-session:$media3_version"
    implementation "androidx.media3:media3-common:$media3_version"

    // Room
    implementation "androidx.room:room-runtime:2.6.1"
    annotationProcessor "androidx.room:room-compiler:2.6.1"

    // NanoHTTPD
    implementation "org.nanohttpd:nanohttpd:2.3.1"

    // 二维码生成（Web 管理地址扫码）。纯 Java、零运行时传递依赖，
    // 已核对不含 java.time / stream / function，minSdk 23 无需 desugaring。
    implementation "com.google.zxing:core:3.5.3"

    // OkHttp + Gson
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.google.code.gson:gson:2.10.1"

    // Glide
    implementation "com.github.bumptech.glide:glide:4.16.0"
    annotationProcessor "com.github.bumptech.glide:compiler:4.16.0"

    // AndroidX
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.core:core:1.12.0"
    implementation "androidx.fragment:fragment:1.6.2"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.cardview:cardview:1.0.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.7.0"
    implementation "androidx.lifecycle:lifecycle-livedata:2.7.0"
}
